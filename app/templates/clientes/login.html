{% extends "base.html" %}

{% block title %}Iniciar Sesión | Agrofrutos{% endblock %}

{% block content %}
<section class="max-w-md mx-auto my-16 px-4">
    <div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-100">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-full bg-emerald-800 flex items-center justify-center text-amber-400 font-bold text-2xl mx-auto mb-3 shadow">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-emerald-950">Iniciar Sesión</h2>
            <p class="text-slate-500 text-sm mt-1">Ingresa tus credenciales para acceder</p>
        </div>

        <form action="{{ url_for('clientes.login') }}" method="POST" class="space-y-5">
            <div>
                <label for="usuario" class="block text-xs font-bold text-slate-700 uppercase mb-2">Usuario o Correo</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="usuario" name="usuario" required autocomplete="username" placeholder="Tu usuario o correo"
                        class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-800 text-sm">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-slate-700 uppercase mb-2">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-800 text-sm">
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-900 hover:bg-emerald-950 text-white font-bold py-3 rounded-xl transition shadow-md">
                Ingresar
            </button>
        </form>
    </div>
</section>
{% endblock %}
